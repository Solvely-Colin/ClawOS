<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>ClawOS Browse</title>
    <style>
      :root { color-scheme: dark; font-family: "Inter Variable", "Noto Sans", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; color: #f3f1ee; background: #090b0b; }
      main { width: min(760px, calc(100vw - 64px)); }
      small { color: #ff684f; font: 600 11px "GeistMono Nerd Font", "Noto Sans Mono", monospace; letter-spacing: .14em; }
      h1 { max-width: 640px; margin: 18px 0 12px; font-size: clamp(38px, 6vw, 68px); line-height: 1.04; letter-spacing: -.045em; }
      p { max-width: 560px; margin: 0; color: #a5a19f; font-size: 17px; line-height: 1.55; }
      section { display: flex; gap: 12px; margin-top: 34px; }
      a { padding: 12px 16px; border: 1px solid #414643; border-radius: 7px; color: #f3f1ee; background: #101312; text-decoration: none; font-weight: 700; }
      a:first-child { border-color: #ff684f; color: #150805; background: #ff684f; }
      a:focus-visible { outline: 2px solid #ff684f; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <small>BROWSER WORKSPACE</small>
      <h1>The web is an agent tool and a human workspace.</h1>
      <p>OpenClaw can attach over the loopback browser bridge. You can watch, take over, or keep working in another ClawOS workspace.</p>
      <section><a href="https://docs.openclaw.ai">OpenClaw docs</a><a href="http://127.0.0.1:18789/">Control UI</a></section>
    </main>
  </body>
</html>
