set $activity 1:Main

seat * hide_cursor 3000
focus_follows_mouse no
default_border none
default_floating_border none
floating_maximum_size -1 x -1
workspace_layout default
exec --no-startup-id /usr/bin/swaybg -i /usr/share/clawos/theme/background.png -m fill

# Keep the proof VM on the same 16:10 canvas as the target MacBook. This
# output name is QEMU-specific and has no effect on physical displays.
output Virtual-1 mode 1440x900 scale 1

# ClawOS owns only this thin native shell. OpenClaw is the durable activity
# canvas; terminal, build, and browser windows are temporary inspectable
# surfaces in its stack, not fixed application workspaces or split panes.
exec --no-startup-id /usr/lib/clawos/clawos-panel
exec --no-startup-id /usr/lib/clawos/clawos-surfaced
exec --no-startup-id /usr/lib/clawos/clawos-agent-shelf
exec --no-startup-id /usr/lib/clawos/clawos-agent-recover
exec --no-startup-id /usr/bin/lxqt-policykit-agent

# Chromium app-mode windows synthesize a Wayland app_id from the launch URL.
# Mark the shell-owned bootstrap identity; conversation titles can change.
for_window [app_id="^chrome-.*clawos-control-ui-bootstrap-agent[.]html-.*$"] mark --add clawos-agent-canvas, border none
for_window [app_id="^clawos-agent$"] mark --add clawos-agent-canvas, border none
# Compatibility rules for the initial bootstrap and setup surfaces:
assign [title="^OpenClaw Control$"] $activity
assign [title="^ClawOS Setup$"] $activity
assign [title="^ClawOS Center$"] $activity
assign [app_id="clawos-onboard-recovery"] $activity

for_window [title="^OpenClaw Control$"] border none
for_window [title="^ClawOS Setup$"] border none, fullscreen enable
# Center is an OS-owned layer-shell overlay with its own scrim and measured
# 1040 × 740 panel, so application chrome never reads as part of the modal.
for_window [app_id="clawos-command"] border none
for_window [app_id="clawos-build"] border none
for_window [app_id="clawos-browse"] border none
for_window [app_id="clawos-command"] floating enable
for_window [app_id="clawos-build"] floating enable
for_window [app_id="clawos-browse"] floating enable

# Inspectable surfaces temporarily cover the activity canvas. Alt+A moves them
# back to the hidden scratchpad and returns the full canvas to OpenClaw.
# Recovery remains the standard kernel VT chord on Ctrl+Alt+F3.
bindsym Mod1+1 workspace $activity
bindsym Mod1+space exec /usr/lib/clawos/clawos-actions-menu
bindsym Mod1+Shift+space exec /usr/lib/clawos/clawos-intent-palette
bindsym Mod1+Return exec /usr/lib/clawos/clawos-surface terminal
bindsym Mod1+b exec /usr/lib/clawos/clawos-surface browser
bindsym Mod1+Shift+b exec /usr/lib/clawos/clawos-surface build
bindsym Mod1+a exec /usr/lib/clawos/clawos-surface agent
bindsym Mod1+Escape exec /usr/lib/clawos/clawos-activity-action
bindsym Mod1+q kill
bindsym Mod1+l exec /usr/lib/clawos/clawos-lock
bindsym Mod1+Shift+e exec /usr/lib/clawos/clawos-power-menu

exec --no-startup-id /usr/bin/swayidle -w timeout 900 '/usr/lib/clawos/clawos-lock' before-sleep '/usr/lib/clawos/clawos-lock'
workspace $activity
exec --no-startup-id /usr/lib/clawos/clawos-entry

# Recovery deliberately remains a standard Linux VT.
