seat * hide_cursor 5000
focus_follows_mouse no
default_border none
default_floating_border none
workspace_layout default
font pango:Inter Variable 10

output Virtual-1 mode 1440x900 scale 1
output * bg /usr/share/clawos/theme/background.png fill

for_window [app_id="clawos-live-welcome"] border none, fullscreen enable

bindsym Mod1+Return exec /usr/bin/foot --config=/etc/clawos/foot.ini
bindsym Mod1+q kill

exec_always --no-startup-id /usr/lib/clawos/clawos-live-welcome

# Ctrl+Alt+F3 deliberately remains an independent recovery console.
