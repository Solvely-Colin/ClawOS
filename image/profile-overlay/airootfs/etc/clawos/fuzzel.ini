[main]
namespace=clawos-activity-palette
font=Inter Variable:size=10
use-bold=yes
prompt="OPEN  ›  "
placeholder=Search installed applications
icon-theme=Adwaita
icons-enabled=yes
filter-desktop=yes
match-mode=fzf
show-actions=no
terminal=/usr/lib/clawos/clawos-surface terminal
launch-prefix=/usr/lib/clawos/clawos-app-from-fuzzel
anchor=center
lines=10
width=46
horizontal-pad=16
vertical-pad=12
inner-pad=7
line-height=18
layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes
enable-mouse=yes

[colors]
background=0b0d0dff
text=f3f1eeff
prompt=a5a19fff
placeholder=747776ff
input=f3f1eeff
match=ff684fff
selection=202121ff
selection-text=f3f1eeff
selection-match=ff684fff
counter=747776ff
border=343636ff

[border]
width=1
radius=10
selection-radius=7

[dmenu]
mode=index
