[main]
namespace=clawos-intent-palette
font=Inter Variable:size=10
use-bold=yes
prompt="DO  ›  "
placeholder=What do you want to do?
icons-enabled=no
match-mode=fzf
anchor=center
lines=7
width=42
horizontal-pad=16
vertical-pad=12
inner-pad=7
line-height=18
layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes
enable-mouse=yes

[colors]
background=0b0d0dff
text=f3f1eeff
prompt=a5a19fff
placeholder=747776ff
input=f3f1eeff
match=ff684fff
selection=202121ff
selection-text=f3f1eeff
selection-match=ff684fff
counter=747776ff
border=343636ff

[border]
width=1
radius=10
selection-radius=7
