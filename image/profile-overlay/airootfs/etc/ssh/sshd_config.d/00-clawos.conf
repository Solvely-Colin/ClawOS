# ClawOS: the account password is the disk passphrase (encrypted installs) or
# empty (passwordless installs). Never accept either over the network. sshd
# takes the first value it sees for each option and reads this directory in
# lexical order, so 00- wins over archiso's live 10-archiso.conf
# (PasswordAuthentication yes, PermitRootLogin yes) and Arch's 99-archlinux.conf.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
