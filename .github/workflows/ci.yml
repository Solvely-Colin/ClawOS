name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python3 -m unittest discover -s m1/tests -p 'test_*.py'
      - run: python3 -m unittest discover -s m3/tests -p 'test_*.py'
      - run: node --test m2/openclaw-plugin/test/*.test.js
      - run: git diff --check
      - run: ./tools/check-tree.sh
  arch-preflight:
    # The full source gate that README.md tells Arch contributors to run and
    # that tools/ci/build-release.sh runs before every ISO build: same image,
    # same pinned package snapshot, same script. Nothing here needs root-only
    # kernel features, KVM or network beyond the Arch archive.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: archlinux:base-devel
    steps:
      # base-devel ships no git. Without it actions/checkout silently falls
      # back to a tarball download and "git diff --check" in preflight-iso
      # has no repository to inspect, so install git before the checkout.
      - name: Install git so the checkout is a real repository
        run: pacman -Syu --noconfirm --needed --disable-download-timeout git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install preflight tooling from the pinned Arch snapshot
        shell: bash
        run: |
          set -euo pipefail
          source m1/config/versions.env
          [[ "$ARCH_SNAPSHOT" =~ ^[0-9]{4}/[0-9]{2}/[0-9]{2}$ ]] || { echo 'ARCH_SNAPSHOT must be YYYY/MM/DD'; exit 1; }
          printf 'Server = https://archive.archlinux.org/repos/%s/$repo/os/$arch\n' "$ARCH_SNAPSHOT" >/etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed --disable-download-timeout \
            git inetutils nodejs python jq shellcheck
      - name: Verify the toolchain the README promises
        shell: bash
        run: |
          set -euo pipefail
          node --version; python3 --version; jq --version; git --version; shellcheck --version
          node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 24 ? 0 : 1)'
          python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 12) else 1)'
      - name: Trust the checkout owned by the runner account
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run the pre-ISO source gate
        run: ./m1/bin/preflight-iso
