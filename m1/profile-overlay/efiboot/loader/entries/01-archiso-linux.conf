# Derived from archiso v89 configs/releng/efiboot/loader/entries/01-archiso-linux.conf (GPL-3.0-or-later);
# title and console options changed by ClawOS 2026-08-26. Not MIT.
title    ClawOS Live (experimental, x86_64 UEFI)
sort-key 01
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% console=tty0 console=ttyS0,115200n8
