# ClawOS: the account password is the disk passphrase (encrypted installs) or
# empty (passwordless installs). Never accept either over the network. sshd
# takes the first value it sees for each option and Arch's sshd_config includes
# this directory before its own defaults, so 10- wins over 99-archlinux.conf.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
