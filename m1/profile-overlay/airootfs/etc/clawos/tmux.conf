set -g default-terminal "tmux-256color"
set -g mouse on
set -g history-limit 50000
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#101312,fg=#a5a19f"
set -g status-left-length 32
set -g status-right-length 64
set -g status-left " #[fg=#ff684f,bold]CLAWOS #[fg=#747876]#S "
set -g status-right "#[fg=#747876]FULL + APPROVALS  %H:%M "
set -g window-status-format " #[fg=#747876]#I:#W "
set -g window-status-current-format " #[fg=#f3f1ee,bold]#I:#W "
set -g pane-border-style "fg=#292d2b"
set -g pane-active-border-style "fg=#ff684f"
set -g message-style "bg=#2d1816,fg=#f3f1ee"
set -g mode-style "bg=#ff684f,fg=#150805"

bind-key r source-file /etc/clawos/tmux.conf \; display-message "ClawOS tmux reloaded"
