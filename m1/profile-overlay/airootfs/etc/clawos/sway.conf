seat * hide_cursor 3000
focus_follows_mouse no
default_border none
default_floating_border none
workspace_layout default
output * bg #080909 solid_color

# Keep the proof VM on the same 16:10 canvas as the target MacBook. This
# output name is QEMU-specific and has no effect on physical displays.
output Virtual-1 mode 1440x900 scale 1

exec --no-startup-id /usr/lib/clawos/clawos-entry

# Recovery deliberately remains a standard Linux VT.
