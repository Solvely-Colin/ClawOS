<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClawOS Launch</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="launch-shell" aria-labelledby="clawos-title">
    <section class="launch-card" aria-live="polite">
      <div class="launch-content">
        <p class="eyebrow">OpenClaw agent OS</p>
        <h1 id="clawos-title">Claw<span>OS</span></h1>

        <div class="message">
          <h2 id="state-title">System ready</h2>
          <p id="state-copy">OpenClaw is ready on this machine.</p>
        </div>

        <button class="primary" id="launch" type="button">
          <span>Launch ClawOS</span>
          <span class="arrow" aria-hidden="true">→</span>
        </button>

        <div class="readiness" aria-label="Machine readiness">
          <span><i></i>OpenClaw ready</span>
          <b aria-hidden="true">·</b>
          <span><i></i>Network connected</span>
          <b aria-hidden="true">·</b>
          <span><i></i>Recovery available</span>
        </div>
      </div>

      <footer>
        <button class="secondary" data-panel="recovery" type="button">Recovery</button>
        <span aria-hidden="true"></span>
        <button class="secondary" data-panel="terminal" type="button">Terminal</button>
      </footer>
    </section>
  </main>

  <dialog id="support-dialog">
    <form method="dialog">
      <p class="eyebrow" id="dialog-eyebrow">ClawOS support</p>
      <h2 id="dialog-title"></h2>
      <p id="dialog-copy"></p>
      <button class="dialog-close" value="close">Done</button>
    </form>
  </dialog>
  <script src="launch.js"></script>
</body>
</html>
