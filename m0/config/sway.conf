# Root-owned ClawOS Milestone 0 kiosk configuration.
# Always launch with: sway -c /etc/clawos/sway.conf

set $lock swaylock --daemonize --color 111318

output * bg #111318 solid_color
seat * hide_cursor 3000
focus_follows_mouse no
default_border none
default_floating_border none
workspace_layout default

exec_always --no-startup-id swayidle -w \
  timeout 600 '$lock' \
  timeout 900 'swaymsg "output * power off"' \
  resume 'swaymsg "output * power on"' \
  before-sleep '$lock'

exec --no-startup-id /usr/lib/clawos/clawos-browser

# Recovery is intentionally standard Linux VT switching, not a custom launcher.
# Sway/libseat must prove Ctrl+Alt+F3 on reference hardware during Milestone 0.
